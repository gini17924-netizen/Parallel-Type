[package]
name = "paralleltype"
version = "0.26.0"
description = "The most customizable typing test website with a minimal design - desktop build"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "zip",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
#the discovery listener binds with SO_REUSEADDR so diagnostics (and a
#second app instance) can share the broadcast port
socket2 = "0.6"
tokio = { version = "1", features = [
  "net",
  "io-util",
  "sync",
  "time",
  "macros",
  "rt",
  "rt-multi-thread",
] }

[profile.release]
strip = true
lto = "thin"
# codegen-units = 1 raised link peak memory enough to OOM inside WSL2
