name: verify

# the full gate the council requires on every change: tsc + vitest + oxlint
# (the whole src tree, 138 rules) + the Rust protocol tests. Kept split from
# the housekeeping workflows — this one BLOCKS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      #the installer smoke costs a full windows build — opt-in only
      smoke_windows:
        description: "also run the windows installer smoke (silent install → launch → process check → uninstall)"
        required: false
        type: boolean
        default: false
      #phase 90: the updater channel smoke builds NOTHING — it installs the
      #published release installers, so both versions must already exist
      smoke_channels:
        description: "also run the updates channel smoke (stable no-op + beta auto-update on real release artifacts)"
        required: false
        type: boolean
        default: false
      channel_smoke_from:
        description: "the channel-aware build to install (e.g. 0.28.5)"
        required: false
        type: string
      channel_smoke_to:
        description: "the newer beta that must auto-land (e.g. 0.28.6)"
        required: false
        type: string

jobs:
  frontend:
    name: frontend — tsc + vitest + oxlint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install (frontend + packages slice, frozen lockfile)
        #the packages' tsconfigs extend @monkeytype/typescript-config — the
        #workspace links must exist for vite:oxc to load them (KI-51). The
        #filters resolve against the CWD, so this step runs at the ROOT —
        #path filters relative to frontend/ matched nothing (run 2 lesson)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter frontend --filter './packages/**'
      # phase 57 correction: run 2's ~1000 "strictness errors" were an
      # artifact of the BROKEN install (the tsconfig extends chain didn't
      # resolve, so tsgo checked under its own fallback profile). With the
      # install fixed the code passes its own tsconfig on linux AND
      # windows — the gate is real now, so it blocks.
      - name: tsc
        run: npx tsc --noEmit
      - name: vitest
        run: npx vitest run
      - name: oxlint (whole src tree)
        run: npx oxlint --config .oxlintrc.json src/ts

  rust:
    name: rust — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      #the crate compiles the tauri runtime — linux needs the gtk/webkit
      #system libraries (the standard tauri v2 prerequisites)
      - name: install the tauri linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: stub the frontend dist (generate_context! embeds it at compile time)
        run: |
          mkdir -p frontend/dist
          echo '<html></html>' > frontend/dist/index.html
      - name: cargo test
        working-directory: frontend/src-tauri
        run: cargo test

  windows-smoke:
    # phase 64 — the installer smoke: a broken installer must surface
    # BEFORE a release is cut with it. Manual: it costs a full windows
    # build (dispatch → check smoke_windows).
    name: windows — installer smoke (silent install → launch → uninstall)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_windows == true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install (frontend + packages slice, frozen lockfile)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter frontend --filter './packages/**'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: build the frontend (madge + ts-check + vite)
        working-directory: frontend
        env:
          #same placeholder as the release workflow — the desktop fork has
          #no server; the local .env.production is git-ignored
          RECAPTCHA_SITE_KEY: desktop-build-placeholder
        run: pnpm build
      - name: build + sign the NSIS bundle
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: pnpm exec tauri build
      - name: smoke — silent install, launch, process check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "frontend/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$bundle" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "no installer was produced" }
          Write-Host "installer: $($installer.FullName)"

          #silent install — currentUser mode, no admin prompt expected
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install exited with $($p.ExitCode)" }

          #locate the installed exe (known dirs first, then a bounded search)
          $exe = @("$env:LOCALAPPDATA\ParallelType\ParallelType.exe",
                   "$env:LOCALAPPDATA\Programs\ParallelType\ParallelType.exe") |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "ParallelType.exe" `
                    -Depth 3 -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw "ParallelType.exe was not found after the silent install" }
          Write-Host "installed at: $exe (version $((Get-Item $exe).VersionInfo.ProductVersion))"

          #launch and confirm the process is alive after 10s — a crash here
          #is exactly the class of failure this job exists to catch
          Start-Process -FilePath $exe | Out-Null
          Start-Sleep -Seconds 10
          $alive = Get-Process -Name "ParallelType" -ErrorAction SilentlyContinue
          if (-not $alive) { throw "the app process was not alive 10s after launch" }
          Write-Host "process alive: PID $($alive.Id) — stopping it"
          $alive | Stop-Process -Force

          #silent uninstall (NSIS copies itself to %TEMP% and re-executes —
          #poll until the install dir is actually gone)
          $dir = Split-Path $exe
          $uninst = Join-Path $dir "Uninstall.exe"
          if (-not (Test-Path $uninst)) { throw "Uninstall.exe is missing beside the app" }
          Start-Process -FilePath $uninst -ArgumentList "/S" | Out-Null
          $gone = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (-not (Test-Path $dir)) { $gone = $true; break }
          }
          if (-not $gone) { throw "the install dir survived the silent uninstall" }
          Write-Host "smoke PASS: silent install → launch → alive → clean uninstall"

  updates-channel-smoke:
    # phase 90 — the updater channel gate: two installs, two channels, on
    # REAL published release artifacts (nothing is built here — both
    # installers are downloaded from the releases, so both versions must
    # already exist). install #1 boots on the stable channel (the default)
    # and must NEVER pull a beta — GitHub's releases/latest structurally
    # excludes pre-releases. install #2 gets channel=beta in the settings
    # file and its boot check must pull the newer beta: download + install
    # + restart, then the installed exe version must match. the pwsh
    # literals stay pure ASCII (the phase 87 mojibake lesson).
    name: windows — updates channel smoke (stable no-op + beta update)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_channels == true
    steps:
      - name: smoke — two installs, two channels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $from = "${{ inputs.channel_smoke_from }}"
          $to = "${{ inputs.channel_smoke_to }}"
          if (-not $from) { throw "channel_smoke_from is required" }
          if (-not $to) { throw "channel_smoke_to is required" }
          $repo = "${{ github.repository }}"
          $tmp = Join-Path $env:RUNNER_TEMP "channel-smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          function Get-Installer([string]$version) {
            $url = "https://github.com/$repo/releases/download/v$version/ParallelType_${version}_x64-setup.exe"
            $out = Join-Path $tmp "setup-$version.exe"
            Invoke-WebRequest -Uri $url -OutFile $out
            return $out
          }

          function Get-InstalledExe {
            $exe = @("$env:LOCALAPPDATA\ParallelType\ParallelType.exe",
                     "$env:LOCALAPPDATA\Programs\ParallelType\ParallelType.exe") |
                   Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $exe) {
              $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "ParallelType.exe" `
                      -Depth 3 -ErrorAction SilentlyContinue |
                     Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $exe) { throw "ParallelType.exe was not found after the silent install" }
            return $exe
          }

          function Install-App([string]$installerPath) {
            $p = Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "silent install exited with $($p.ExitCode)" }
            return Get-InstalledExe
          }

          function Uninstall-App([string]$exePath) {
            Get-Process -Name "ParallelType" -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            $dir = Split-Path $exePath
            $uninst = Join-Path $dir "Uninstall.exe"
            if (-not (Test-Path $uninst)) { throw "Uninstall.exe is missing beside the app" }
            Start-Process -FilePath $uninst -ArgumentList "/S" | Out-Null
            $gone = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if (-not (Test-Path $dir)) { $gone = $true; break }
            }
            if (-not $gone) { throw "the install dir survived the silent uninstall" }
          }

          function ExeVersion([string]$exePath) {
            return (Get-Item $exePath).VersionInfo.ProductVersion
          }

          # ---- install #1: the STABLE channel (the default) ----
          $installerFrom = Get-Installer $from
          $exe1 = Install-App $installerFrom
          $ver1 = ExeVersion $exe1
          Write-Host "install #1: $exe1 (version $ver1)"
          Start-Process -FilePath $exe1 | Out-Null
          Start-Sleep -Seconds 15
          $p1 = Get-Process -Name "ParallelType" -ErrorAction SilentlyContinue
          if (-not $p1) { throw "the stable boot was not alive 15s after launch" }
          #observe a full minute: the stable manifest must never deliver a
          #beta, and (as shipped today) it points below $from, so nothing
          #installs at all
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5
            $v = ExeVersion $exe1
            if ($v.StartsWith($to)) { throw "the stable boot pulled a beta ($v) - the stable endpoint leaked a pre-release" }
          }
          Write-Host "stable PASS: alive for a full minute, no beta pulled (exe still $(ExeVersion $exe1))"
          Uninstall-App $exe1
          Write-Host "install #1 uninstalled"

          # ---- install #2: the BETA channel ----
          $exe2 = Install-App $installerFrom
          $ver2 = ExeVersion $exe2
          Write-Host "install #2: $exe2 (version $ver2)"
          $cfgDir = "$env:APPDATA\com.monkeytype.desktop"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          #the settings file shape the rust side reads (phases 56 + 90)
          Set-Content -Path (Join-Path $cfgDir "updates-settings.json") `
            -Value '{"autoCheck": true, "channel": "beta"}' -Encoding UTF8
          Write-Host "channel=beta written; booting - the boot check must pull $to over $from"
          Start-Process -FilePath $exe2 | Out-Null
          $landed = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            if ((ExeVersion $exe2).StartsWith($to)) { $landed = $true; break }
          }
          if (-not $landed) {
            throw "the beta update did not land within 300s (exe still $(ExeVersion $exe2))"
          }
          Write-Host "beta PASS: the boot check pulled $to over $from (exe now $(ExeVersion $exe2))"
          Uninstall-App $exe2
          Write-Host "channel smoke PASS: two channels, two installs"
