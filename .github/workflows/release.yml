name: release

# phase 63 — the release pipeline: one dispatch = tag → build → sign → publish.
# the version input drives everything: the app version is overridden via
# --config (no source files are touched), the v-tag is created at the checked
# out HEAD, and five files land in the release (NSIS installer, its updater
# signature, latest.json, and since phase 87 the portable zip + its sha256
# sidecar — the zip boots without any installer or registry writes and is
# smoke-tested on the runner before it may publish). A pre-release stays out
# of the updater's /latest endpoint, so it is the safe test vehicle.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version (e.g. 0.28.2) — becomes the app version, the v-tag and the release"
        required: true
        type: string
      prerelease:
        description: "mark as pre-release (the updater endpoint never serves pre-releases)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: build → sign → publish (windows nsis)
    runs-on: windows-latest
    steps:
      - name: guard the version input (rpm forbids hyphens)
        #rpm's version grammar has no hyphen (it separates version from
        #release), so a version like 0.28.4-rc1 dies mid-bundle AFTER a
        #four-minute compile — fail fast here instead; the rc-ness of a
        #test release is expressed by the prerelease flag, not the string
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.version }}' in
            *-*)
              echo "::error::the version must not contain a hyphen (rpm forbids it) - express the prerelease-ness with the prerelease flag"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install (frontend + packages slice, frozen lockfile)
        #same shape as verify.yml — the workspace links must exist for the
        #tsconfig extends chain (KI-51), and the filters resolve at the ROOT
        working-directory: .
        run: pnpm install --frozen-lockfile --filter frontend --filter './packages/**'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: build the frontend (madge + ts-check + vite)
        working-directory: frontend
        env:
          #vite refuses a production build without this defined; the desktop
          #fork has no server, so it is a placeholder (the local
          #.env.production is git-ignored and never reaches CI)
          RECAPTCHA_SITE_KEY: desktop-build-placeholder
        run: pnpm build

      - name: build + sign the NSIS bundle
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          #the keypair was generated with an empty password — the CLI needs
          #the env var present, not a prompt
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tauri build --config '{"version":"${{ inputs.version }}"}'

      - name: assemble the portable zip (phase 87)
        #the raw binary next to the NSIS bundle: the dist is embedded at
        #compile time and the bundle declares no external resources, so the
        #portable artifact is the exe itself (plus a hint README) — it boots
        #with zero registry writes where the installer registers an uninstall
        #entry. the README is written via node -e (heredocs mangle here).
        shell: bash
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          REL="frontend/src-tauri/target/release"
          BIN="$(ls "$REL/ParallelType.exe" "$REL/paralleltype.exe" 2>/dev/null | head -1 || true)"
          test -n "$BIN" || { echo "::error::the raw exe was not found under target/release"; exit 1; }
          DIR="$REL/ParallelType_${V}_x64-portable"
          PORTZIP="$DIR.zip"
          rm -rf "$DIR" "$PORTZIP" "$PORTZIP.sha256"
          mkdir -p "$DIR"
          cp "$BIN" "$DIR/ParallelType.exe"
          node -e '
            const fs = require("fs");
            const [dir, version] = process.argv.slice(1);
            const readme = [
              "ParallelType " + version + " — portable build",
              "",
              "unzip anywhere and run ParallelType.exe — nothing is installed",
              "and no registry entries are written; the app keeps its data in",
              "the user profile folder, same as any other run of the app.",
              "",
              "requirement: the Microsoft Edge WebView2 runtime (preinstalled",
              "on Windows 10/11; the NSIS installer can bootstrap it, a zip",
              "cannot).",
              "",
              "updates: this zip is not wired to the in-app updater — grab the",
              "newer portable zip from the releases page.",
              "",
            ].join("\n");
            fs.writeFileSync(dir + "/README.txt", readme);
            console.log("README.txt written");
          ' "$DIR" "$V"
          DIRWIN="$(cygpath -w "$DIR")"
          ZIPWIN="$(cygpath -w "$PORTZIP")"
          powershell.exe -NoProfile -Command "Compress-Archive -Path '$DIRWIN' -DestinationPath '$ZIPWIN' -Force"
          printf '%s  %s\n' "$(sha256sum "$PORTZIP" | cut -d' ' -f1)" "$(basename "$PORTZIP")" > "$PORTZIP.sha256"
          ls -la "$PORTZIP" "$PORTZIP.sha256"

      - name: smoke the portable zip (phase 87)
        #the gate: the zip must actually BOOT — extract, run, require the
        #process alive after 10s (the same alive-check class the installer
        #smoke of phase 64 uses; the runner image ships WebView2, so a dead
        #process here means a broken portable boot, not a missing runtime).
        #powershell 5.1 reads the script file as ANSI when it lacks a BOM,
        #so every literal below stays pure ASCII (an em dash becomes mojibake
        #and shreds the parser — the first dispatch found it)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "frontend/src-tauri/target/release/ParallelType_${{ inputs.version }}_x64-portable.zip"
          if (-not (Test-Path $zip)) { throw "portable zip missing: $zip" }
          $out = Join-Path $env:RUNNER_TEMP "portable-smoke"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $out
          $exe = Get-ChildItem $out -Recurse -Filter "ParallelType.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "ParallelType.exe is not inside the portable zip" }
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 10
          $p = Get-Process -Name "ParallelType" -ErrorAction SilentlyContinue
          if ($null -eq $p) { throw "the portable exe died within 10s - the portable boot is broken" }
          Write-Output "portable smoke: ParallelType.exe alive (PID $($p.Id)) after 10s"
          Stop-Process -Name "ParallelType" -Force
          Write-Output "portable smoke: process stopped"

      - name: assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          BUNDLE="frontend/src-tauri/target/release/bundle/nsis"
          ls -la "$BUNDLE"
          #a missing signature means the build ran WITHOUT the key — never
          #publish an installer the updater cannot verify (KI-49's silent path)
          test -f "$BUNDLE/ParallelType_${V}_x64-setup.exe.sig" || {
            echo "::error::no .sig beside the installer — the build was not signed"
            exit 1
          }
          node -e '
            const fs = require("fs");
            const [bundle, version, repo] = process.argv.slice(1);
            const exe = `ParallelType_${version}_x64-setup.exe`;
            const signature = fs.readFileSync(`${bundle}/${exe}.sig`, "utf8").trim();
            const manifest = {
              version,
              notes: `ParallelType v${version} — the signed desktop build (NSIS installer + updater artifacts).`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature,
                  url: `https://github.com/${repo}/releases/download/v${version}/${exe}`
                }
              }
            };
            fs.writeFileSync(`${bundle}/latest.json`, JSON.stringify(manifest, null, 2) + "\n");
            console.log("latest.json written for", version);
          ' "$BUNDLE" "$V" "${{ github.repository }}"

      - name: publish the release (tag + five files)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          BUNDLE="frontend/src-tauri/target/release/bundle/nsis"
          REL="frontend/src-tauri/target/release"
          EXE="$BUNDLE/ParallelType_${V}_x64-setup.exe"
          SIG="$EXE.sig"
          LATEST="$BUNDLE/latest.json"
          PORTZIP="$REL/ParallelType_${V}_x64-portable.zip"
          PORTSHA="$PORTZIP.sha256"
          test -f "$EXE" && test -f "$SIG" && test -f "$LATEST"
          #the portable zip already survived its boot smoke — publish it too
          test -f "$PORTZIP" && test -f "$PORTSHA"
          FLAGS=""
          if [ '${{ inputs.prerelease }}' = 'true' ]; then FLAGS="--prerelease"; fi
          gh release create "v$V" \
            --title "v$V" \
            --notes "ParallelType v$V — the desktop build published by the release workflow (phases 63 + 87: NSIS installer + updater artifacts + the portable zip, which boots with no install and no registry writes)." \
            $FLAGS \
            "$EXE" "$SIG" "$LATEST" "$PORTZIP" "$PORTSHA"

      - name: generate + validate + publish the packaging manifests (phase 65)
        #winget manifest trio (schema 1.9.0) + a scoop manifest + a sha256
        #sidecar — all built from the REAL published artifact's hash, so
        #the manifests are true for exactly this release. shape mirrors
        #packaging/winget/0.28.1 in-repo.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          REPO='${{ github.repository }}'
          BUNDLE="frontend/src-tauri/target/release/bundle/nsis"
          EXE="$BUNDLE/ParallelType_${V}_x64-setup.exe"
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const [bundle, version, repo] = process.argv.slice(1);
            const exe = `ParallelType_${version}_x64-setup.exe`;
            const sha = crypto.createHash("sha256")
              .update(fs.readFileSync(`${bundle}/${exe}`)).digest("hex").toUpperCase();
            const url = `https://github.com/${repo}/releases/download/v${version}/${exe}`;
            const dir = `packaging/winget/${version}`;
            fs.mkdirSync(dir, { recursive: true });
            const hdr = (t) => `# yaml-language-server: $schema=https://aka.ms/winget-manifest.${t}.1.9.0.schema.json\n`;
            const pkg = "ParallelType.ParallelType";
            const versionYaml = [
              `PackageIdentifier: ${pkg}`,
              `PackageVersion: ${version}`,
              "DefaultLocale: en-US",
              "ManifestType: version",
              "ManifestVersion: 1.9.0",
              "",
            ].join("\n");
            const installerYaml = [
              `PackageIdentifier: ${pkg}`,
              `PackageVersion: ${version}`,
              "Installers:",
              "  - Architecture: x64",
              "    InstallerType: nullsoft",
              `    InstallerUrl: ${url}`,
              `    InstallerSha256: ${sha}`,
              "    InstallerSwitches:",
              "      Silent: /S",
              "      SilentWithProgress: /S",
              "    UpgradeBehavior: install",
              "ManifestType: installer",
              "ManifestVersion: 1.9.0",
              "",
            ].join("\n");
            const localeYaml = [
              `PackageIdentifier: ${pkg}`,
              `PackageVersion: ${version}`,
              "PackageLocale: en-US",
              "Publisher: ParallelType",
              "PackageName: ParallelType",
              `PackageUrl: https://github.com/${repo}`,
              "License: GPL-3.0",
              `LicenseUrl: https://github.com/${repo}/blob/main/LICENSE`,
              "ShortDescription: A keyboard-driven desktop typing trainer with mini-games, themes, stats, and real LAN matches.",
              "Tags:",
              "  - typing",
              "  - touch-typing",
              "  - keyboard",
              "  - wpm",
              "Moniker: paralleltype",
              "ManifestType: defaultLocale",
              "ManifestVersion: 1.9.0",
              "",
            ].join("\n");
            fs.writeFileSync(`${dir}/${pkg}.yaml`, hdr("version") + versionYaml);
            fs.writeFileSync(`${dir}/${pkg}.installer.yaml`, hdr("installer") + installerYaml);
            fs.writeFileSync(`${dir}/${pkg}.locale.en-US.yaml`, hdr("defaultLocale") + localeYaml);
            //the sha256 sidecar — the scoop autoupdate hash source
            fs.writeFileSync(`${bundle}/${exe}.sha256`, `${sha.toLowerCase()}  ${exe}\n`);
            const scoop = {
              version,
              homepage: `https://github.com/${repo}`,
              license: "GPL-3.0",
              notes: "The installer runs silently (currentUser) and registers its own Start Menu shortcut. Updates: run scoop update paralleltype.",
              architecture: {
                "64bit": {
                  url: `${url}#/ParallelType_setup.exe`,
                  hash: sha.toLowerCase(),
                },
              },
              installer: { args: ["/S"] },
              checkver: {
                url: `https://github.com/${repo}/releases/latest/download/latest.json`,
                regex: "\"version\"\\s*:\\s*\"([^\"]+)\"",
              },
              autoupdate: {
                architecture: {
                  "64bit": {
                    url: `https://github.com/${repo}/releases/download/v$version/ParallelType_$version_x64-setup.exe#/ParallelType_setup.exe`,
                    hash: {
                      url: `https://github.com/${repo}/releases/download/v$version/ParallelType_$version_x64-setup.exe.sha256`,
                    },
                  },
                },
              },
            };
            fs.writeFileSync(`${bundle}/paralleltype.json`, JSON.stringify(scoop, null, 2) + "\n");
            console.log("manifests generated for", version);
          ' "$BUNDLE" "$V" "$REPO"
          if command -v winget >/dev/null 2>&1; then
            set +e
            winget validate --manifest "packaging/winget/$V"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 40 ]; then
              echo "::error::winget validate failed (exit $rc)"
              exit 1
            fi
          else
            echo "winget is not on the runner — the shape was validated on the maintainer machine (phase 65)"
          fi
          gh release upload "v$V" "$EXE.sha256" \
            "packaging/winget/$V/ParallelType.ParallelType.yaml" \
            "packaging/winget/$V/ParallelType.ParallelType.installer.yaml" \
            "packaging/winget/$V/ParallelType.ParallelType.locale.en-US.yaml" \
            "$BUNDLE/paralleltype.json"
          echo "packaging manifests published for v$V"

      - name: refresh beta.json on the fixed beta release (phase 90)
        #beta reads ONLY pre-releases: every pre-release dispatch rewrites
        #the manifest on the fixed `beta` release so its static URL
        #(releases/download/beta/beta.json — a tag, not the moving
        #releases/latest, which structurally excludes pre-releases) always
        #serves the newest beta. a stable dispatch never touches it.
        if: ${{ inputs.prerelease == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          REPO='${{ github.repository }}'
          BUNDLE="frontend/src-tauri/target/release/bundle/nsis"
          node -e '
            const fs = require("fs");
            const [bundle, version, repo] = process.argv.slice(1);
            const exe = `ParallelType_${version}_x64-setup.exe`;
            const signature = fs.readFileSync(`${bundle}/${exe}.sig`, "utf8").trim();
            const manifest = {
              version,
              notes: `ParallelType ${version} — the beta channel build (pre-releases only).`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature,
                  url: `https://github.com/${repo}/releases/download/v${version}/${exe}`
                }
              }
            };
            fs.writeFileSync(`${bundle}/beta.json`, JSON.stringify(manifest, null, 2) + "\n");
            console.log("beta.json written for", version);
          ' "$BUNDLE" "$V" "$REPO"
          gh release view beta >/dev/null 2>&1 || {
            gh release create beta --title "beta channel" --notes "the beta updater manifest lives here - refreshed by every pre-release dispatch (phase 90)."
          }
          gh release upload beta "$BUNDLE/beta.json" --clobber
          echo "beta.json published for v$V"

  linux:
    name: build the linux bundles (deb + rpm + appimage)
    #phase 89 — linux distribution returns: the same version override, the
    #same frontend build and the phase 51 apt list; the bundles attach to
    #the release the windows job just published. runs after it (needs:) so
    #the upload target always exists. the ledger named pkg.tar.zst (arch);
    #tauri v2 has no pacman bundler — deb + rpm + appimage are the real
    #three (recorded as the deviation).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: guard the version input (rpm forbids hyphens)
        #same rule as the windows job's guard — fail before any build time
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.version }}' in
            *-*)
              echo "::error::the version must not contain a hyphen (rpm forbids it) - express the prerelease-ness with the prerelease flag"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install (frontend + packages slice, frozen lockfile)
        run: pnpm install --frozen-lockfile --filter frontend --filter './packages/**'

      - uses: dtolnay/rust-toolchain@stable

      - name: install the tauri linux prerequisites (phase 51's list)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: build the frontend (madge + ts-check + vite)
        working-directory: frontend
        env:
          RECAPTCHA_SITE_KEY: desktop-build-placeholder
        run: pnpm build

      - name: build the linux bundles
        working-directory: frontend
        env:
          #the updater-artifact flag is on, so the appimage signing wants
          #the key present — same secret, same empty-password shape
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm exec tauri build --config '{"version":"${{ inputs.version }}"}'

      - name: upload the linux bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          BUNDLE="frontend/src-tauri/target/release/bundle"
          ls -la "$BUNDLE"
          DEB="$(ls "$BUNDLE/deb/"*.deb 2>/dev/null | head -1 || true)"
          RPM="$(ls "$BUNDLE/rpm/"*.rpm 2>/dev/null | head -1 || true)"
          APP="$(ls "$BUNDLE/appimage/"*.AppImage 2>/dev/null | head -1 || true)"
          test -n "$DEB" || { echo "::error::no .deb was produced"; exit 1; }
          test -n "$RPM" || { echo "::error::no .rpm was produced"; exit 1; }
          test -n "$APP" || { echo "::error::no .AppImage was produced"; exit 1; }
          #the appimage carries an updater signature when the key was live —
          #upload it too, but never gate on it (deb/rpm get no signature)
          APPSIG="$(ls "$BUNDLE/appimage/"*.AppImage.sig 2>/dev/null | head -1 || true)"
          if [ -n "$APPSIG" ]; then
            gh release upload "v$V" "$DEB" "$RPM" "$APP" "$APPSIG"
          else
            gh release upload "v$V" "$DEB" "$RPM" "$APP"
          fi
          echo "linux bundles published for v$V"
